<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Study tools: scientific calculator, unit converter, focus timer and quick notes.">
  <title>Tools · Pathshala-X</title>
  <script src="js/boot.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>">
</head>
<body data-page="tools">
  <div class="app">
    <main class="main" id="main">
      <div class="container">
        <header class="page-header">
          <div>
            <div class="eyebrow">Tools</div>
            <h1>Study toolkit</h1>
            <p>Everything you need at your desk — right in the browser.</p>
          </div>
        </header>

        <div class="grid grid-2">
          <!-- Calculator -->
          <section class="card" aria-labelledby="calcTitle">
            <div class="card-title"><h2 id="calcTitle">🧮 Calculator</h2><span class="hint">Keyboard supported</span></div>
            <div class="calc-display" aria-live="polite">
              <div class="calc-expr" id="calcExpr">&nbsp;</div>
              <div class="calc-result" id="calcResult">0</div>
            </div>
            <div class="calc-keys" id="calcKeys">
              <button class="key fn" data-k="clear" type="button" aria-label="Clear">C</button>
              <button class="key fn" data-k="back" type="button" aria-label="Backspace">⌫</button>
              <button class="key fn" data-k="(" type="button">(</button>
              <button class="key fn" data-k=")" type="button">)</button>
              <button class="key op" data-k="/" type="button" aria-label="Divide">÷</button>

              <button class="key fn" data-k="sqrt(" type="button" aria-label="Square root">√</button>
              <button class="key" data-k="7" type="button">7</button>
              <button class="key" data-k="8" type="button">8</button>
              <button class="key" data-k="9" type="button">9</button>
              <button class="key op" data-k="*" type="button" aria-label="Multiply">×</button>

              <button class="key fn" data-k="^" type="button" aria-label="Power">xʸ</button>
              <button class="key" data-k="4" type="button">4</button>
              <button class="key" data-k="5" type="button">5</button>
              <button class="key" data-k="6" type="button">6</button>
              <button class="key op" data-k="-" type="button" aria-label="Subtract">−</button>

              <button class="key fn" data-k="π" type="button" aria-label="Pi">π</button>
              <button class="key" data-k="1" type="button">1</button>
              <button class="key" data-k="2" type="button">2</button>
              <button class="key" data-k="3" type="button">3</button>
              <button class="key op" data-k="+" type="button" aria-label="Add">+</button>

              <button class="key fn" data-k="%" type="button" aria-label="Percent">%</button>
              <button class="key" data-k="0" type="button">0</button>
              <button class="key" data-k="." type="button">.</button>
              <button class="key fn" data-k="ans" type="button" aria-label="Previous answer">Ans</button>
              <button class="key eq" data-k="=" type="button" aria-label="Equals">=</button>
            </div>
          </section>

          <!-- Focus timer -->
          <section class="card" aria-labelledby="timerTitle" style="text-align:center">
            <div class="card-title"><h2 id="timerTitle">⏳ Focus timer</h2><span class="badge" id="sessionCount">0 sessions today</span></div>
            <div class="segmented" role="group" aria-label="Timer mode" id="timerModes">
              <button type="button" data-mode="focus" class="active">Focus 25</button>
              <button type="button" data-mode="short">Break 5</button>
              <button type="button" data-mode="long">Long break 15</button>
            </div>
            <div class="ring timer-face" id="timerRing">
              <div class="ring-label">
                <span class="timer-time" id="timerTime">25:00</span>
                <span class="small muted" id="timerLabel">Stay focused</span>
              </div>
            </div>
            <div class="row" style="justify-content:center">
              <button class="btn btn-lg" id="timerStart" type="button">▶ Start</button>
              <button class="btn btn-lg btn-ghost" id="timerReset" type="button">↺ Reset</button>
            </div>
          </section>

          <!-- Unit converter -->
          <section class="card" aria-labelledby="convTitle">
            <div class="card-title"><h2 id="convTitle">📏 Unit converter</h2></div>
            <div class="chips" id="convCategories" style="margin-bottom:16px"></div>
            <div class="converter">
              <div class="field">
                <label for="convFromValue">From</label>
                <input class="input" id="convFromValue" type="number" value="1" step="any" inputmode="decimal">
                <select class="select" id="convFromUnit" aria-label="From unit"></select>
              </div>
              <button class="icon-btn swap" id="convSwap" type="button" aria-label="Swap units">⇄</button>
              <div class="field">
                <label for="convToValue">To</label>
                <input class="input" id="convToValue" type="text" readonly>
                <select class="select" id="convToUnit" aria-label="To unit"></select>
              </div>
            </div>
            <p class="small muted" id="convFormula" style="margin-top:12px"></p>
          </section>

          <!-- Notes -->
          <section class="card" aria-labelledby="notesTitle">
            <div class="card-title">
              <h2 id="notesTitle">📝 Quick notes</h2>
              <span class="hint" id="notesStatus">Saved</span>
            </div>
            <label for="notes" class="sr-only">Notes</label>
            <textarea class="textarea" id="notes" style="min-height:200px" placeholder="Jot down formulas, reminders or anything you want to remember. Notes save automatically in this browser."></textarea>
            <div class="row" style="margin-top:12px">
              <span class="small muted" id="notesCount">0 words</span>
              <span class="spacer"></span>
              <button class="btn btn-ghost btn-sm" id="notesDownload" type="button">⬇ Download</button>
              <button class="btn btn-danger btn-sm" id="notesClear" type="button">Clear</button>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script src="js/tools.js"></script>
</body>
</html>
